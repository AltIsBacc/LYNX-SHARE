// LYNX SHARE for Android (docs/ANDROID.md). The native part is the repository's own CMake project (../../CMakeLists.txt)
// built for Android: its `lynx_android` target is the engine (android/native) without the JUCE app.
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ka1s.lynx'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.ka1s.lynx'
        minSdk 26 // (the core names its worker threads with pthread_setname_np, from API 26)
        targetSdk 35
        versionCode 1
        versionName '0.1.31' // (the version of ../../CMakeLists.txt)

        // 64-bit only, like the desktop builds: arm64 phones and tablets, and the x86_64 emulator
        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                arguments '-DLYNX_BUILD_APP=OFF'
                targets 'lynx_android'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
