name: Android

on:
  push:
    branches: [android, 'wip/**']
    paths: &paths
      - 'android/**'
      - 'src/core/**'
      - 'src/flp/**'
      - 'third_party/**'
      - 'CMakeLists.txt'
      - '.github/workflows/android.yml'
  pull_request:
    paths: *paths
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1

jobs:
  apk:
    name: APK (debug)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"
      - name: Build
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Libraries in the APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/arm64-v8a/liblynx_android\.so'
      - uses: actions/upload-artifact@v4
        with:
          name: LYNX-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
